<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财税知识与 Wiki</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/wiki.css"><script type="module" src="/static/wiki.js"></script></head>
<body><div class="wiki-shell"><header class="wiki-header"><div><a href="/">← 政策工作台</a><h1>财税知识与 Wiki</h1><p>从原文依据到专题知识，保留条件、例外和每次修订。</p></div><div><span id="wiki-mode"></span><button id="wiki-refresh">刷新</button></div></header>
<p id="wiki-message" role="status" aria-live="polite"></p><nav class="wiki-tabs" aria-label="知识导航"><button data-tab="domains">领域与专题</button><button data-tab="items">知识条目</button><button data-tab="pages">专题 Wiki</button><button data-tab="jobs">加工任务</button><button data-tab="impacts">待处理变化</button></nav>
<form id="wiki-search"><input name="q" aria-label="知识搜索" placeholder="搜索正文、附件、知识或 Wiki"><select name="kind" aria-label="结果类型"><option value="all">全部类型</option><option value="material">资料</option><option value="item">知识</option><option value="page">Wiki</option></select><select name="domain" id="wiki-search-domain" aria-label="领域筛选"><option value="">全部领域</option></select><select name="topic" id="wiki-search-topic" aria-label="专题筛选"><option value="">全部专题</option></select><input name="region" aria-label="适用地区" placeholder="适用地区"><input name="subject" aria-label="适用主体" placeholder="适用主体"><input name="as_of" type="date" aria-label="适用时点"><label><input name="include_limited" type="checkbox">包含受限内容</label><button>搜索</button></form>
<details><summary>证据索引与解析缺口</summary><div id="wiki-index-status"></div></details><details id="wiki-batch"><summary>批量人工操作</summary><p>在知识或 Wiki 列表勾选版本，逐项核对后操作。</p><textarea id="wiki-batch-reason" aria-label="批量审核理由" placeholder="填写本次逐项核对理由"></textarea><label><input id="wiki-batch-confirm" type="checkbox">我已核对全部所选版本，确认本次操作</label><button data-batch="review" data-write>批量审核通过</button><button data-batch="publish" data-write>批量启用或发布</button></details><div class="wiki-columns"><aside id="wiki-list" aria-label="领域与内容列表"></aside><main id="wiki-detail" aria-label="知识详情"><h2>选择领域或内容</h2><p>空专题显示资料缺口，不代表知识已经覆盖。</p></main></div>
<details class="wiki-management"><summary>加工与维护</summary><div class="wiki-tools"><button data-operation="seed" data-write>建立企业所得税优惠导航</button><button data-operation="index.rebuild" data-write>重建证据索引</button><button data-operation="impact.scan" data-write>核查来源变化</button><label>导入领域与专题<input id="wiki-domain-file" type="file" accept="application/json,.json" data-write></label></div>
<form id="wiki-job-form"><h2>创建加工任务</h2><label>任务类型<select name="job_type"><option value="extract">提取知识</option><option value="merge">归并候选</option><option value="compile">编纂专题 Wiki</option><option value="revise">修订 Wiki</option></select></label><label>专题<select name="topic_id" id="wiki-topic"></select></label><fieldset><legend>已复核资料（提取/归并）</legend><div id="wiki-materials"></div></fieldset><fieldset><legend>正式知识（编纂/修订）</legend><div id="wiki-knowledge"></div></fieldset><label>基于当前选中对象<input name="use_current" type="checkbox"></label><label>单次最多调用次数<input name="max_calls" type="number" min="1" max="20" value="3"></label><button data-write>创建待处理任务</button></form></details>
<details><summary>后台命令状态</summary><div id="wiki-operations"></div></details>
<dialog id="wiki-evidence"><button id="wiki-evidence-close">关闭原文</button><div id="wiki-evidence-content"></div></dialog></div></body></html>
