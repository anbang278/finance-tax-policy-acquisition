<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="查询已采集的财税资料，观察采集任务与发现队列。">
  <title>政策工作台</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#policies"><span class="brand-mark">政</span><span>政策工作台<small>财税资料 · 资料库</small></span></a>
      <div class="nav-label">工作空间</div>
      <nav aria-label="主导航">
        <a class="nav-item active" href="#policies" data-view="policies"><span data-icon="library"></span>政策库<span id="nav-policy-count" class="nav-count">—</span></a>
        <a class="nav-item" href="#tasks" data-view="tasks"><span data-icon="activity"></span>采集监控<span id="nav-task-count" class="nav-count">—</span></a>
      </nav>
      <div class="side-bottom"><button id="sources-open" class="source-button"><span data-icon="globe"></span>查看采集来源<span data-icon="arrow"></span></button><div class="local-note"><i></i>只读政策工作台<small>资料保存与复核状态分别展示</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><span class="breadcrumb">工作空间 <span>/</span> <strong id="view-name">政策库</strong></span><div class="topbar-actions"><span id="connection" class="connection">连接中</span><button id="refresh" class="button subtle"><span data-icon="refresh"></span><span>刷新</span></button></div></header>
      <div id="error-banner" class="error-banner" role="status" hidden></div>
      <section class="page-heading"><div><div class="eyebrow" id="eyebrow">POLICY LIBRARY</div><h1 id="page-title">政策库</h1><p id="page-description">找到资料，读到原文，保留每一份证据。</p></div><div id="overview" class="overview"><span>正在读取资料库资料…</span></div></section>
      <section id="policies-view" class="view">
        <form id="policy-filters" class="filters" aria-label="政策筛选">
          <label class="search-field"><span data-icon="search"></span><input name="q" id="policy-search" placeholder="搜索标题、文号或正文" aria-label="搜索政策" maxlength="500"><kbd>↵</kbd></label>
          <div class="filter-row">
            <select name="source_id" aria-label="政策来源"><option value="">全部来源</option><option value="mof">财政部</option><option value="chinatax">国家税务总局</option></select>
            <select name="document_type" id="policy-type" aria-label="资料类型"></select>
            <select name="quality_state" id="policy-quality" aria-label="质量状态"></select>
            <label class="date-range">来源日期<input name="date_from" type="date" aria-label="来源日期开始"><span>—</span><input name="date_to" type="date" aria-label="来源日期结束"></label>
            <select name="sort" aria-label="政策排序"><option value="date">来源日期 ↓</option><option value="title">标题 ↑</option></select>
            <button type="reset" class="text-button">重置</button>
          </div>
        </form>
        <div class="workspace" id="policy-workspace">
          <section class="list-pane" aria-label="政策列表"><div class="pane-heading"><strong>已采集资料</strong><span id="policy-total">—</span></div><div id="policy-list" class="scroll list-content"></div><div id="policy-pagination" class="pagination"></div></section>
          <section id="policy-detail" class="detail-pane scroll" aria-label="政策详情"><div class="empty-state"><span data-icon="file"></span><h2>选择一份资料开始阅读</h2><p>正文、附件与版本证据会在这里展示。</p></div></section>
        </div>
      </section>
      <section id="tasks-view" class="view" hidden>
        <div class="monitor-note"><span data-icon="info"></span>依据数据库记录观察队列与结果；未接入进程心跳，无法确定此刻的下载项。</div>
        <div class="workspace" id="task-workspace">
          <section class="list-pane" aria-label="采集任务列表"><div class="pane-heading"><strong>采集任务</strong><select id="task-state" aria-label="任务状态"></select></div><div id="task-list" class="scroll list-content"></div><div id="task-pagination" class="pagination"></div></section>
          <section id="task-detail" class="detail-pane scroll" aria-label="采集任务详情"><div class="empty-state"><span data-icon="activity"></span><h2>选择一个采集任务</h2><p>查看发现队列、来源进度与失败记录。</p></div></section>
        </div>
      </section>
      <footer class="statusbar"><span>SQLite · 资料库资料</span><span id="query-time">等待查询</span></footer>
    </main>
  </div>
  <dialog id="sources-dialog" aria-labelledby="sources-title"><div class="dialog-heading"><div><span class="eyebrow">COLLECTION SOURCES</span><h2 id="sources-title">采集来源</h2></div><button id="sources-close" class="icon-button" aria-label="关闭来源详情">×</button></div><div id="sources-content"></div></dialog>
</body>
</html>
