name: 三平台运行验证
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      FTR_WEB_BROWSER: '1'
      FTR_NETWORK__PROXY_MODE: direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv
        run: python -m pip install uv
      - name: 安装锁定依赖
        run: uv sync --frozen --extra dev --extra web
      - name: 安装浏览器
        run: uv run playwright install --with-deps chromium
      - name: Windows 引导脚本语法
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('scripts/setup.ps1', 'scripts/run.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      # Separate native commands so PowerShell cannot replace a failing exit code
      # with the success of a later command in the same step.
      - name: 完整测试
        run: uv run --extra dev --extra web pytest -q
      - name: Ruff 静态检查
        run: uv run --extra dev --extra web ruff check src tests scripts
      - name: Mypy 类型检查
        run: uv run --extra dev --extra web mypy --ignore-missing-imports src
      - name: 构建
        run: uv build
      - name: 独立安装检查
        run: python scripts/verify_wheel.py
