# 复制为外部运行配置；用 ftr --config /绝对路径/ftr.yaml config validate 校验。
# 相对路径基于本文件所在目录；环境变量覆盖 YAML；不在这里存放真实密码。
data_dir: ~/.local/share/ftr
network:
  proxy_mode: system  # system / direct / explicit
  proxy_url: null  # explicit 时填写，如 http://127.0.0.1:7890
  timeout_seconds: 30
  interval_seconds: 2
  retry_attempts: 3  # 每个 HTTP 请求最多尝试次数，Repair 上限优先
  retry_backoff_seconds: 1  # 指数退避基数，另加 0–0.25 秒抖动
  max_file_bytes: 50000000
browser:
  headless: false  # Linux 无桌面环境使用 xvfb-run，不自动切换无界面模式
  executable_path: null  # 自动验证：已有 Chromium → Edge → Chrome；setup 按需下载
  timeout_seconds: 30
collection:
  consecutive_failure_limit: 3  # 同来源连续详情瞬态失败耗尽后停止
  progress_interval_seconds: 30  # stderr 进度，stdout 保留最终 JSON
  max_pages: 1000  # 每来源、每次运行；新任务冻结，续跑保持任务原值
  max_documents: 1000
  max_duration_seconds: 1800  # 单次运行时间预算
  max_bytes_per_source: 500000000
web:
  startup_timeout_seconds: 15  # lifecycle 启动总截止时间
  host: 127.0.0.1  # 团队局域网使用 0.0.0.0 或服务器网卡 IP
  port: 8765
  poll_interval_ms: 5000
  request_timeout_ms: 10000
scheduler:
  enabled: false  # 明确授权后启用；systemd/YAML 变更需重启；本机持久计划优先
  timezone: Asia/Shanghai
  times: ['09:00', '18:00']
  lookback_days: 30  # 含当天；首次启用立即执行该窗口
  batch_interval_seconds: 60  # 同来源批次间隔；来源串行轮转
  retry_delays_seconds: [300, 900, 3600]  # 请求级重试之外最多 3 次；空列表不追加重试

update_check:
  enabled: true  # 官方 main 检测，只提醒；离线环境可关闭
  cache_seconds: 86400  # 成功结果缓存 24 小时
  failure_retry_seconds: 3600  # 检查失败退避 1 小时
  timeout_seconds: 3  # 每轮联网检查总截止时间

processing:
  enabled: false  # 启用后仍只执行用户明确启动的任务
  base_url: null  # OpenAI 兼容服务的 /v1 根地址；远程使用 HTTPS
  model: null
  api_key_env: MODEL_API_KEY  # 密钥只在环境变量中配置，避免 FTR_ 前缀
  auth_mode: bearer  # 本机无鉴权服务可明确选择 none
  response_format: json_object  # json_schema / json_object / text，不自动切换
  token_limit_parameter: max_completion_tokens  # 旧兼容服务可选择 max_tokens
  timeout_seconds: 120
  max_output_tokens: 8192
